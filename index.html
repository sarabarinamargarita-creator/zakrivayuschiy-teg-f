<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Закрывающий тег</title>
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <link rel="stylesheet" href="./styles/variables.css" />
    <link rel="stylesheet" href="./styles/globals.css" />
    <link rel="stylesheet" href="./styles/style.css" />
    <link rel="stylesheet" href="./styles/animations.css" />
    <link rel="icon" href="./favicon/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="./favicon/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="./favicon/apple-touch-icon.png" />
  </head>
  <body class="page">
    <header class="header content-width">
      <h1 class="header__title">
        <span class="header__logo">&lt;/HTML&gt;</span>
        <span class="header__subtitle">закрывающий тег</span>
      </h1>
    </header>
    <main>
      <article class="card content-width">
        
        <h2 class="card__title">Фритрек и нулевой спринт: Подготовка к работе</h2>
        <img class="card__image" src="./images/car-one.png" alt="Иллюстрация к карточке">

        <div class="card__content">
          <p class="card__text">Это было самое начало пути. На этом этапе важно было проникнуться основами и настроиться на учёбу. И, возможно, подумать, как новые знания могут повлиять на ваше будущее.</p>
          <p class="card__text">Место для ваших воспоминаний о начале обучения.</p>
          </div>

          <div class="card__buttons">
            <button class="card__icon-button">
              <svg class="like-icon" width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M6 0H3V3H6V0Z" fill="black"/>
                <path d="M9 0H6V3H9V0Z" fill="black"/>
                <path d="M3 3H0V6H3V3Z" fill="black"/>
                <path d="M3 6H0V9H3V6Z" fill="black"/>
                <path d="M3 9H0V12H3V9Z" fill="black"/>
                <path d="M12 0H9V3H12V0Z" fill="black"/>
                <path d="M6 12H3V15H6V12Z" fill="black"/>
                <path d="M9 15H6V18H9V15Z" fill="black"/>
                <path d="M12 18H9V21H12V18Z" fill="black"/>
                <path d="M21 0H24V3H21V0Z" fill="black"/>
                <path d="M18 0H21V3H18V0Z" fill="black"/>
                <path d="M24 3H27V6H24V3Z" fill="black"/>
                <path d="M24 6H27V9H24V6Z" fill="black"/>
                <path d="M24 9H27V12H24V9Z" fill="black"/>
                <path d="M15 0H18V3H15V0Z" fill="black"/>
                <path d="M21 12H24V15H21V12Z" fill="black"/>
                <path d="M18 15H21V18H18V15Z" fill="black"/>
                <path d="M15 18H18V21H15V18Z" fill="black"/>
                <path d="M15 3H12V6H15V3Z" fill="black"/>
                <path d="M15 21H12V24H15V21Z" fill="black"/>
              </svg>
            </button>

            <button class="button card__like-button">
              <span class="button__text">Like</span>
            </button>   

        <button class="button card__save-button">
      <svg class="icon" width="21" height="21">
        <use href="./svg/symbols.svg#icon-floppy"></use>
      </svg>
      <span class="button__text">Сохранить на память</span>
          </button>
          </div>
      </article>
    </main>
    <script src="./scripts/like.js"></script>
  </body>
</html>
